<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Masthead — Dergi Kapağı Editörü</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');

/* ============================================================
   TEMEL & DEĞİŞKENLER
============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Renk — siyah/beyaz + ince altın vurgu */
  --ink: #0e0e0d;
  --ink-soft: #2a2a28;
  --paper: #fafaf8;
  --paper-alt: #f3f2ee;
  --line: #e6e4de;
  --line-strong: #d4d1c9;
  --muted: #8b8880;
  --label: #5a5852;
  --gold: #a98947;
  --gold-soft: #f0e9d8;

  /* Tipografi */
  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;

  /* Geometri */
  --radius: 4px;
  --radius-lg: 8px;

  /* Güvenli alanlar */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  font-family: var(--sans);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100%;
}

body {
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

button { font-family: inherit; }
input, textarea { font-family: inherit; }

/* ============================================================
   UYGULAMA ÇATISI
============================================================ */
.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------- HEADER ---------- */
.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255,255,255,.92);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  gap: 12px;
}
.brand {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}
.brand-name {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.brand-sub {
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 3px;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Butonlar */
.btn {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border-radius: var(--radius);
  cursor: pointer;
  padding: 9px 14px;
  transition: background .18s, border-color .18s, color .18s, transform .12s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--line-strong);
  color: var(--label);
}
.btn-ghost:hover {
  border-color: var(--ink);
  color: var(--ink);
}
.btn-primary {
  background: var(--ink);
  border: 1px solid var(--ink);
  color: #fff;
}
.btn-primary:hover { background: #000; }
.btn-primary:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* ============================================================
   ÇALIŞMA ALANI
   Mobil: tek sütun (önce editör, sonra önizleme)
   Masaüstü: yan yana
============================================================ */
.workspace {
  display: flex;
  flex-direction: column;
  flex: 1;
}

/* ============================================================
   EDİTÖR PANELİ (form)
============================================================ */
.editor {
  background: #fff;
  border-bottom: 1px solid var(--line);
  padding: 20px 18px 24px;
}

.editor-inner {
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.section-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.section-num {
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
  font-style: italic;
  line-height: 1;
}
.section-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink);
}

/* Upload */
.upload {
  position: relative;
  border: 1.5px dashed var(--line-strong);
  border-radius: var(--radius-lg);
  background: var(--paper-alt);
  padding: 22px 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.upload:hover {
  border-color: var(--gold);
  background: #faf8f2;
}
.upload-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #fff;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}
.upload-title {
  font-size: 13px;
  color: var(--ink);
  font-weight: 500;
}
.upload-hint {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.upload-thumb {
  margin-top: 12px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--line);
  display: none;
}
.upload-thumb.show { display: block; }
.upload-thumb img {
  width: 100%;
  display: block;
  max-height: 180px;
  object-fit: cover;
}
.upload input[type="file"] { display: none; }

/* Form alanları — 2 sütunlu grid */
.fields {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.field-input {
  width: 100%;
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  padding: 11px 12px;
  font-size: 14px;
  color: var(--ink);
  outline: none;
  transition: border-color .18s, box-shadow .18s;
  -webkit-appearance: none;
  appearance: none;
}
.field-input:focus {
  border-color: var(--ink);
  box-shadow: 0 0 0 3px rgba(14,14,13,.06);
}
.field-input::placeholder { color: var(--muted); }
textarea.field-input {
  resize: vertical;
  min-height: 72px;
  line-height: 1.45;
  font-family: var(--sans);
}

/* Alt eylem satırı (Sıfırla + Dışa Aktar — editör altında mobil için kolay erişim) */
.editor-actions {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
.editor-actions .btn { flex: 1; }

/* ============================================================
   ÖNİZLEME ALANI
============================================================ */
.preview {
  background: var(--paper-alt);
  padding: 22px 16px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.preview-label {
  font-size: 9px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}

/* Kapak çerçevesi — her zaman 8.5:11 oranı */
.cover-stage {
  width: 100%;
  max-width: 360px;         /* mobilde ekran */
  aspect-ratio: 8.5 / 11;
  position: relative;
}

.cover {
  position: absolute;
  inset: 0;
  border-radius: 3px;
  overflow: hidden;
  background: #1a1a18;
  box-shadow:
    0 18px 40px rgba(0,0,0,.16),
    0 4px 12px rgba(0,0,0,.08);
  container-type: size;      /* cqh/cqw için */
}

/* Fotoğraf katmanı */
.cover-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: #1a1a18;
}
.cover-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}
.cover-img.show { display: block; }

/* Karartma katmanı — metinlerin okunması için */
.cover-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to top,
    rgba(0,0,0,.72) 0%,
    rgba(0,0,0,.28) 45%,
    rgba(0,0,0,.10) 100%
  );
}

/* Boş durum */
.cover-empty {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px;
  text-align: center;
  color: rgba(255,255,255,.85);
}
.cover-empty.hidden { display: none; }
.cover-empty-icon {
  width: 48px;
  height: 48px;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cover-empty-title {
  font-family: var(--serif);
  font-size: 15px;
  color: rgba(255,255,255,.95);
}
.cover-empty-sub {
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,.7);
}

/* ============================================================
   KAPAK İÇERİĞİ — cqh (container-query-height) ile ölçek
   Tüm boyutlar kapak kutusuna göre ölçeklenir → oran korunur.
============================================================ */
.cover-content {
  position: absolute;
  inset: 0;
  z-index: 2;
  padding: 6cqh 5cqw;         /* her ekranda orantılı */
  color: #fff;
}

/* Marka alanı — logo + fashiontv aynı baseline'da, magazine altta sola hizalı */
.cov-brand {
  position: absolute;
  top: 1cqh;
  left:1cqw;
  display: flex;
  align-items: center;
  gap: 2cqw;
}
.cov-logo {
  width: 170cqh;
  height: 170cqh;
  flex-shrink: 0;
  object-fit: contain;
 
  display: block;
}
.cov-brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1;
  min-width: 0;
}
.cov-brand-name {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 14cqh;
  line-height: 0.88;
  letter-spacing: -0.035em;
  color: #fff;
  text-transform: lowercase;
  white-space: nowrap;
}
.cov-magazine {
  font-family: var(--sans);
  font-size: 1.5cqh;
  font-weight: 500;
  letter-spacing: 0.32em;
  text-transform: lowercase;
  color: rgba(255,255,255,.85);
  margin-top: 0.8cqh;
  margin-left: 55cqw;
  white-space: nowrap;
}

/* Sol / sağ kapak yazıları — editorial dengesizlik: sağ biraz daha yukarıda */
.cov-side {
  position: absolute;
  font-size: 1.55cqh;
  line-height: 1.7;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(255,255,255,.82);
  max-width: 30cqw;
  white-space: pre-line;
}
.cov-side-left {
  left: 2cqw;
  top: 60cqh;
  text-align: left;
}
.cov-side-right {
  right: 2cqw;
  top: 32cqh;
  text-align: right;
}

/* Sol/Sağ kapak yazıları — yanlarda */
.cov-side {
  position: absolute;
  font-size: 1.9cqh;
  line-height: 1.5;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,.9);
  max-width: 38cqw;
  white-space: pre-line;      /* \n korunur */
}
/* Alt bilgi bloğu — ad soyad + alt başlık + edition, alt solda hizalı stack */
.cov-bottom {
  position: absolute;
  left: 2cqw;
  right: 30cqw;
  bottom: 6cqh;
  display: flex;
  flex-direction: column;
  align-items: flex-start;

}

/* Ad Soyad — ana vurgu, büyük harf, sol hizalı */
.cov-headline {
  font-family: var(--serif);
  font-weight: 700;
  font-size:  5cqh;
  line-height: 1.02;
  letter-spacing: -0.005em;
  color: #fff;
  word-break: break-word;
  text-transform: uppercase;
  text-align: right;
  max-width: 100%;
}

/* Alt başlık */
.cov-sub {
  font-size: 3cqh;
  line-height: 1.5;
  color: rgba(255,255,255,.9);
  font-weight: 400;
  max-width: 100%;
  margin-top: 1.4cqh;
  text-align: left;
  position: relative;
  left: -20cqw;
    display: none;
}
.cov-sub:empty { display: none; }

/* Sayı / Tarih — ad soyadla aynı sol çizgide */
.cov-edition {
  font-size: 1.35cqh;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: rgba(255,255,255,.72);
  white-space: nowrap;
  margin-top: 1.6cqh;
  text-align: left;
    position: relative;
  left: 1cqw;
}

/* Barkod — sağ alt köşe */
.cov-barcode {
  position: absolute;
  right: 5cqw;
  bottom: 5cqh;
  width: 22cqw;
  max-width: 90px;
  height: 5.5cqh;
  background: #fff;
  border-radius: 2px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.8cqh 1cqw;
}
.cov-barcode svg {
  width: 100%;
  height: 100%;
}

/* Boyut etiketi */
.preview-size {
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Toast */
.toast-area {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(20px + var(--safe-bottom));
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--ink);
  color: #fff;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
  animation: toastIn .28s ease forwards;
  white-space: nowrap;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Dışa aktarma katmanı */
.export-overlay {
  position: fixed;
  inset: 0;
  background: rgba(250,250,248,.94);
  backdrop-filter: blur(4px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 500;
}
.export-overlay.show { display: flex; }
.spinner {
  width: 34px;
  height: 34px;
  border: 2.5px solid var(--line);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.export-label {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--label);
}

/* ============================================================
   MASAÜSTÜ — 880px ve üzeri
============================================================ */
@media (min-width: 880px) {
  .workspace {
    flex-direction: row;
    height: calc(100vh - 64px);
  }
  .editor {
    width: 380px;
    flex-shrink: 0;
    border-bottom: none;
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 28px 26px 32px;
  }
  .editor-inner {
    max-width: none;
    gap: 28px;
  }
  .fields {
    grid-template-columns: 1fr 1fr;
    gap: 14px 12px;
  }
  .field-full { grid-column: 1 / -1; }

  .preview {
    flex: 1;
    padding: 36px;
    overflow: hidden;
  }
  .cover-stage {
    max-width: none;
    width: auto;
    height: 100%;
    max-height: calc(100vh - 64px - 110px);
  }
  /* Masaüstünde kapak daha büyük olduğundan gölge güçlendirilsin */
  .cover {
    box-shadow:
      0 30px 80px rgba(0,0,0,.22),
      0 8px 20px rgba(0,0,0,.10);
  }

  /* Masaüstünde editor-actions'ı gizle (header'da buton var) */
  .editor-actions { display: none; }

  .toast-area {
    bottom: auto;
    top: 80px;
    left: auto;
    right: 24px;
    transform: none;
  }
}

/* Çok küçük mobil — 360px altı */
@media (max-width: 359px) {
  .app-header { padding: 12px 14px; }
  .brand-sub { display: none; }
  .btn { padding: 8px 10px; font-size: 10px; }
  .editor { padding: 16px 14px 20px; }
  .preview { padding: 18px 12px 28px; }
}
</style>
</head>
<body>

<div class="app">

  <!-- ================= HEADER ================= -->
  <header class="app-header">
    <div class="brand">
      <span class="brand-name">fashiontv</span>
      <span class="brand-sub">Dergi Kapağı Editörü</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" id="btnReset" type="button">Sıfırla</button>
      <button class="btn btn-primary" id="btnExport" type="button">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5.5 1v6M2.5 5l3 3 3-3"/>
          <path d="M1 9h9"/>
        </svg>
        Dışa Aktar
      </button>
    </div>
  </header>

  <!-- ================= WORKSPACE ================= -->
  <div class="workspace">

    <!-- EDİTÖR -->
    <section class="editor" aria-label="Kapak düzenleyici">
      <div class="editor-inner">

        <!-- 01 · Fotoğraf -->
        <div class="section">
          <div class="section-head">
            <span class="section-num">01</span>
            <span class="section-title">Kapak Fotoğrafı</span>
          </div>
          <label class="upload" id="uploadZone">
            <div class="upload-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b8880" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 16V4M6 10l6-6 6 6"/>
                <path d="M4 20h16"/>
              </svg>
            </div>
            <span class="upload-title">Fotoğraf seç veya sürükle</span>
            <span class="upload-hint">JPG · PNG · Maks. 20 MB</span>

          </label>
          <div class="upload-thumb" id="uploadThumb">
            <img id="uploadThumbImg" src="" alt="Yüklenen fotoğraf">
          </div>
        </div>

        <!-- 02 · Metinler -->
        <div class="section">
          <div class="section-head">
            <span class="section-num">02</span>
            <span class="section-title">Metinler</span>
          </div>

          <div class="fields">
            <div class="field field-full">
              <label class="field-label" for="fHead">Ad Soyad</label>
              <input class="field-input" id="fHead" type="text" placeholder="Ad Soyad" maxlength="40" />
            </div>

            <div class="field field-full">
              <label class="field-label" for="fSub">Alt Başlık</label>
              <textarea class="field-input" id="fSub" placeholder="Kısa bir alt başlık yazın" maxlength="120"></textarea>
            </div>
          </div>
        </div>

        <!-- Mobilde alt aksiyon çubuğu -->
        <div class="editor-actions">
          <button class="btn btn-ghost" id="btnResetMobile" type="button">Sıfırla</button>
          <button class="btn btn-primary" id="btnExportMobile" type="button">Dışa Aktar</button>
        </div>

      </div>
    </section>

    <!-- ÖNİZLEME -->
    <section class="preview" aria-label="Canlı önizleme">
      <span class="preview-label">Canlı Önizleme</span>

      <div class="cover-stage">
        <div class="cover" id="coverCard">

          <div class="cover-bg">
            <img class="cover-img" id="coverImg" src="" alt="">
            <div class="cover-overlay"></div>
          </div>

          <div class="cover-empty" id="coverEmpty">
            <div class="cover-empty-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.6"/>
                <path d="M3 16l5-5 4 4 3-3 6 6"/>
              </svg>
            </div>
            <div class="cover-empty-title">Önizleme burada</div>
            <div class="cover-empty-sub">Fotoğraf yükleyin</div>
          </div>

          <div class="cover-content">
            <div class="cov-brand" aria-label="fashiontv magazine">
              <img class="cov-logo" src="logo.png" alt="fashiontv" />
              <div class="cov-brand-text">
                <span class="cov-brand-name">fashiontv</span>
                <span class="cov-magazine">magazine</span>
              </div>
            </div>

            <div class="cov-side cov-side-left">YENİ STİL KOD
İLHAM VEREN SEÇKİLER</div>

</div>

<script>
(() => {
  'use strict';

  // ----- Varsayılanlar (placeholder metinleri) -----
  const DEFAULTS = {
    head: 'Ad Soyad',
    sub:  ''
  };

  // ----- Element referansları -----
  const $ = (id) => document.getElementById(id);

  const els = {
    // inputlar
    fHead: $('fHead'), fSub: $('fSub'),

    // kapak
    magHead: $('magHead'), magSub: $('magSub'),

    // fotoğraf
    fileInput: $('fileInput'),
    coverImg:  $('coverImg'),
    coverEmpty: $('coverEmpty'),
    uploadThumb: $('uploadThumb'),
    uploadThumbImg: $('uploadThumbImg'),

    // aksiyonlar
    btnReset: $('btnReset'),
    btnExport: $('btnExport'),
    btnResetMobile: $('btnResetMobile'),
    btnExportMobile: $('btnExportMobile'),

    // sahneler
    coverCard: $('coverCard'),
    toastArea: $('toastArea'),
    exportOverlay: $('exportOverlay')
  };

  // ----- Uygulama durumu -----
  const state = {
    photoUrl: null
  };

  // ----- Toast -----
  let toastTimer = null;
  function toast(message) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = message;
    els.toastArea.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .28s, transform .28s';
      el.style.opacity = '0';
      el.style.transform = 'translateY(6px)';
      setTimeout(() => el.remove(), 320);
    }, 1800);
  }

  // ----- Metin senkronu -----
  function syncText() {
    els.magHead.textContent = els.fHead.value.trim() || DEFAULTS.head;
    els.magSub.textContent  = els.fSub.value.trim()  || DEFAULTS.sub;
  }

  // ----- Fotoğraf -----
  function applyPhoto(url) {
    state.photoUrl = url;

    els.coverImg.src = url;
    els.coverImg.classList.add('show');
    els.coverEmpty.classList.add('hidden');

    els.uploadThumbImg.src = url;
    els.uploadThumb.classList.add('show');
  }

  function clearPhoto() {
    state.photoUrl = null;
    els.coverImg.src = '';
    els.coverImg.classList.remove('show');
    els.coverEmpty.classList.remove('hidden');
    els.uploadThumbImg.src = '';
    els.uploadThumb.classList.remove('show');
    els.fileInput.value = '';
  }

  function handleFile(file) {
    if (!file) return;
    if (file.size > 20 * 1024 * 1024) {
      toast('Dosya 20 MB\'den büyük');
      return;
    }
    if (!file.type.startsWith('image/')) {
      toast('Sadece görsel dosyaları');
      return;
    }
    const url = URL.createObjectURL(file);
    applyPhoto(url);
    toast('Fotoğraf yüklendi');
  }

  // ----- Dışa aktarma -----
  async function doExport() {
    if (typeof html2canvas === 'undefined') {
      toast('Dışa aktarma kullanılamıyor');
      return;
    }

    els.btnExport.disabled = true;
    els.btnExportMobile.disabled = true;
    els.exportOverlay.classList.add('show');

    try {
      // Kısa bir frame bekle → spinner görünür olsun
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

      const canvas = await html2canvas(els.coverCard, {
        scale: 3,
        useCORS: true,
        backgroundColor: null,
        logging: false
      });

      const link = document.createElement('a');
      link.download = 'dergi-kapak.png';
      link.href = canvas.toDataURL('image/png');
      link.click();

      toast('Dışa aktarıldı');
    } catch (err) {
      console.error(err);
      toast('Dışa aktarma başarısız');
    } finally {
      els.exportOverlay.classList.remove('show');
      els.btnExport.disabled = false;
      els.btnExportMobile.disabled = false;
    }
  }

  // ----- Sıfırla -----
  function resetAll() {
    els.fHead.value = '';
    els.fSub.value  = '';
    clearPhoto();
    syncText();
    toast('Editör sıfırlandı');
  }

  // ----- Event binding -----
  [els.fHead, els.fSub]
    .forEach(el => el.addEventListener('input', syncText));

  els.fileInput.addEventListener('change', (e) => {
    handleFile(e.target.files && e.target.files[0]);
  });

  // Upload alanına sürükle-bırak
  const uploadZone = $('uploadZone');
  ['dragenter', 'dragover'].forEach(evt => {
    uploadZone.addEventListener(evt, (e) => {
      e.preventDefault();
      uploadZone.style.borderColor = 'var(--gold)';
      uploadZone.style.background = '#faf8f2';
    });
  });
  ['dragleave', 'drop'].forEach(evt => {
    uploadZone.addEventListener(evt, (e) => {
      e.preventDefault();
      uploadZone.style.borderColor = '';
      uploadZone.style.background = '';
    });
  });
  uploadZone.addEventListener('drop', (e) => {
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    handleFile(file);
  });

  els.btnReset.addEventListener('click', resetAll);
  els.btnResetMobile.addEventListener('click', resetAll);
  els.btnExport.addEventListener('click', doExport);
  els.btnExportMobile.addEventListener('click', doExport);

  // İlk sync
  syncText();
})();
</script>
